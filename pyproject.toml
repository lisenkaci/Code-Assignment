[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "codebase-knowledge-analyzer"
version = "0.1.0"
description = "Token-aware, LLM-assisted static analysis for source code repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lisen Kaci" }]
dependencies = [
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "javalang>=0.13",
    "lizard>=1.17",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rich>=13.9",
    "tiktoken>=0.8",
    "typer>=0.15",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
codebase-analyzer = "codebase_analyzer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebase_analyzer = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["codebase_analyzer"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["codebase_analyzer"]
